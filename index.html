<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NAQD Auditor Console</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e7eaf0; --muted:#9aa3b2; --accent:#f59e0b; --accent2:#6366f1;
    --ok:#16a34a; --warn:#f59e0b; --danger:#ef4444; --info:#0ea5e9; --violet:#8b5cf6;
    --radius:12px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fa; --panel:#ffffff; --panel2:#f0f2f7; --line:#e2e6ee;
           --txt:#1a1f2b; --muted:#5b6473; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px}
  input,select,textarea{font:inherit;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  a{color:var(--accent2)}
  .hidden{display:none!important}

  /* ---- Top bar ---- */
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}

  /* ---- Layout ---- */
  main{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:0;height:calc(100vh - 55px)}
  @media (max-width:900px){ main{grid-template-columns:1fr} .detail{display:none} main.showdetail .list{display:none} main.showdetail .detail{display:flex} }
  .list{border-right:1px solid var(--line);overflow-y:auto;background:var(--bg)}
  .detail{overflow-y:auto;display:flex;flex-direction:column}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:4px;padding:10px 12px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
  .tab{background:transparent;color:var(--muted);border:1px solid transparent;padding:6px 10px;font-size:12.5px;border-radius:999px}
  .tab.active{background:var(--panel);color:var(--txt);border-color:var(--line)}
  .tab .cnt{display:inline-block;min-width:18px;text-align:center;margin-left:6px;font-size:11px;padding:0 5px;border-radius:999px;background:var(--panel2);color:var(--muted)}
  .tab.active .cnt{background:var(--accent);color:#000}

  /* ---- Case cards ---- */
  .card{margin:10px 12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:var(--accent2)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .card .nm{font-weight:700}
  .card .meta{color:var(--muted);font-size:12px;margin-top:2px}
  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}

  /* ---- Detail ---- */
  .dhead{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:4}
  .dhead .back{display:none;background:var(--panel2);margin-bottom:10px}
  @media (max-width:900px){ .dhead .back{display:inline-block} }
  .dhead h2{margin:0 0 2px;font-size:19px}
  .kv{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;color:var(--muted);font-size:12.5px}
  .kv b{color:var(--txt);font-weight:600}
  .dbody{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
  .section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .section > h3{margin:0;padding:12px 16px;font-size:13px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .section .rows{padding:6px 0}
  .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row label{font-size:13.5px}
  .row .ctl{display:flex;gap:6px;align-items:center;min-width:200px;justify-content:flex-end}
  .yn{display:flex;gap:4px}
  .yn button{padding:5px 12px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .yn button.on[data-v="yes"]{background:var(--ok);color:#fff;border-color:var(--ok)}
  .yn button.on[data-v="no"]{background:var(--danger);color:#fff;border-color:var(--danger)}
  .yn button.on[data-v="na"]{background:var(--muted);color:#fff}
  .amt{max-width:170px}
  .progress{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:8px}
  .progress > i{display:block;height:100%;background:var(--accent)}

  /* ---- Action bar ---- */
  .actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn-primary{background:var(--accent);color:#111;font-weight:700}
  .btn-ok{background:var(--ok);color:#fff;font-weight:700}
  .btn-warn{background:var(--warn);color:#111;font-weight:700}
  .btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .actions .spacer{flex:1}
  .hint{color:var(--muted);font-size:12px}

  /* ---- Login ---- */
  .gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}
  .gate .box{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
  .gate .logo{width:52px;height:52px;border-radius:14px;margin:0 auto 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:22px}
  .gate input{text-align:center;letter-spacing:3px;font-size:16px;margin:14px 0}
  .gate .err{color:var(--danger);font-size:12px;min-height:16px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:60;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  textarea{min-height:60px;resize:vertical}
  .modechip{cursor:pointer}
</style>
</head>
<body>

<!-- ======================= APP ======================= -->
<div id="app">
  <header>
    <div class="logo">A</div>
    <div>
      <h1>NAQD Auditor Console</h1>
      <div class="sub">Tax-audit verification &amp; 3CB-3CD filing bridge</div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="connPill"><span class="dot" style="background:var(--muted)"></span>connecting…</span>
    <span class="pill modechip" onclick="location.reload()">↻ refresh</span>
  </header>

  <main id="main">
    <!-- LIST -->
    <div class="list">
      <div class="tabs" id="tabs"></div>
      <div id="cards"></div>
    </div>

    <!-- DETAIL -->
    <div class="detail" id="detail">
      <div class="empty" style="margin:auto">Select a case from the list to begin the review.</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
